# config/settings.yaml
ticker: "META"  # switched from AAPL — backtested real accuracy of 60.6% across 6 folds
                # (vs. AAPL's 54.5%, mostly noise-level for a stock this efficiently priced)

data:
  historical_start: "2020-01-01"
  live_window_days: 90        # rolling window size for drift comparison (D1)
  sequence_length: 20         # lookback window fed into the model per prediction

drift:
  threshold: 0.30              # KS-test / PSI score above this triggers classification
  spike_magnitude_std: 2.5     # std-devs above rolling mean to count as a "spike" (was 3.0 — max
                                # observed |z| in real AAPL history is ~2.71, so 3.0 never fired)
  spike_max_duration_days: 3   # anomaly spikes revert within this many days
  regime_min_duration_days: 5  # sustained shifts lasting at least this long => regime shift

confidence:
  mc_dropout_passes: 20
  abstain_below: 0.55          # fallback default only, for a model that predates calibration
                                # (e.g. freshly constructed in tests); real models use their own
                                # calibrate_abstain_threshold() value instead — see train.py
  abstain_percentile: 25       # abstain on the bottom 25% least-confident predictions,
                                # calibrated per model from its own validation-set distribution

retraining:
  benchmark_window_days: 60    # held-out window used to validate a candidate model
  min_improvement: 0.0         # candidate must not underperform current model

paths:
  raw_dir: "data/raw"
  live_dir: "data/live"
  snapshot_dir: "data/snapshots"
  model_dir: "models"
  drift_log: "logs/drift_events.jsonl"
  retrain_log: "logs/retrain_log.jsonl"
  backtest_log_dir: "logs/backtest_results"   # one {ticker}.json per stock — see run_backtest.py
  prediction_log: "logs/prediction_log.jsonl"
  drift_performance_log: "logs/drift_performance_report.json"

backtest:
  n_folds: 6                # number of walk-forward folds
  min_train_days: 250       # rows required before the first fold trains (~1 trading year)
  test_window_days: 30      # held-out days evaluated per fold, no overlap with that fold's training rows

tickers:                    # stocks scripts/onboard_tickers.py trains + backtests by default
  nasdaq: [AAPL, MSFT, NVDA, AMZN, GOOG, META, AVGO, TSLA, COST, NFLX]   # top 10 Nasdaq by market cap
  india:  [RELIANCE.NS, TCS.NS, HDFCBANK.NS, ICICIBANK.NS, BHARTIARTL.NS,
           INFY.NS, SBIN.NS, ITC.NS, HINDUNILVR.NS, LT.NS]               # top Indian large caps (NSE listings;
                                                                          # Yahoo's BSE .BO feed returns 1 row for most of these)

schedule:
  daily_run_time: "17:30"   # local time scripts/scheduler.py runs the daily cycle at (FR-3)

training:
  epochs: 80                # training epochs for the baseline/candidate model
  hidden_size: 64            # LSTM hidden state size
  num_layers: 2              # stacked LSTM layers
  dropout: 0.3               # dropout rate (also drives MC Dropout confidence, FR-10)
  learning_rate: 0.001
  weight_decay: 0.0001       # L2 regularization, to fight overfitting on a small dataset
  val_fraction: 0.15         # slice of the TRAIN split (never the held-out test) used to
                              # pick the best-performing epoch instead of just taking the last one